name: ML Pipeline

on:
  schedule:
    # 04:37 UTC (off-peak) : les crons GitHub Actions à heure pile (:00) et 05:00 UTC
    # sont massivement congestionnés → délais de queue observés de 4-5 h (runs
    # 09:24/09:59 pour un 05:00 demandé). Minute impaire + heure creuse = file quasi
    # nulle ; le training termine avant le fallback Vercel 05:15 et generate-daily 05:30.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport spécifique (laisser vide pour tous)'
        required: false
        default: ''
      dry_run:
        description: "Dry run (pas d'export Supabase)"
        required: false
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Football-data enrichment (P4 — best effort, jamais bloquant)
        continue-on-error: true
        run: |
          # Réactive l'enrichissement P2-stub: CSV statiques gratuits
          # football-data.co.uk → data/enrichment/training_enrichment.json
          # (détection auto par train_xgboost.py; échec = training normal sans)
          timeout 240 python ml/football_data_enricher.py || echo "⚠️ Enrichissement indisponible — training sans enrichissement"

      - name: Run ML Training
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Jitter: délai aléatoire 0-60s pour éviter les patterns temporels
          DELAY=$(python3 -c "import random; print(random.randint(0,60))")
          sleep $DELAY
          ARGS="--no-telegram"
          if [ -n "${{ github.event.inputs.sport }}" ]; then
            ARGS="$ARGS --sport ${{ github.event.inputs.sport }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python ml/train_xgboost.py $ARGS

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-training-${{ github.run_number }}
          path: ml/last_training_result.json
          retention-days: 30
